# Publish the browser build to GitHub Pages.
#
# Kept separate from ci.yml because it deploys rather than checks: it needs the `pages` and
# `id-token` permissions, and it must not run concurrently with itself. CI stays a pure
# verification workflow.
#
# The page is the engine compiled to WebAssembly, so the deploy is genuinely building the
# instrument — not copying static files around.

name: Publish web build

on:
  push:
    branches: [main, claude/sonicware-deconstruct-emulation-c91vb8]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and never cancel one part-way — a half-finished deploy would leave
# the published page broken rather than merely out of date.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build and test the web bundle
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # The real SDK rather than the npm convenience package: the latter ships a prebuilt
      # `wasm-opt` that does not run on a runner, and `-O3` fails the moment it is invoked.
      # Pinned so the published bundle is reproducible, and cached because installing it is by
      # some distance the slowest thing in this job. The activated config lives inside ~/emsdk,
      # so the one cached directory is the whole SDK.
      - name: Cache emscripten
        id: emsdk-cache
        uses: actions/cache@v4
        with:
          path: ~/emsdk
          key: emsdk-${{ runner.os }}-6.0.5

      - name: Install emscripten
        if: steps.emsdk-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git ~/emsdk
          ~/emsdk/emsdk install 6.0.5
          ~/emsdk/emsdk activate 6.0.5

      - name: Build the engine to WebAssembly
        run: |
          source ~/emsdk/emsdk_env.sh
          ./web/build.sh

      - name: Fold it into a single file
        run: node web/bundle.mjs

      # The same browser test that runs locally. Publishing a page that loads but produces
      # silence would be worse than not publishing at all, and only a real browser catches that.
      #
      # The bundle gets the same 22 checks rather than a smoke test, because it rewrites how the
      # worklet is loaded — and a worklet that fails to load looks exactly like a working page
      # until you listen. Once more under a restrictive CSP, which is what proves there is no
      # network dependency left in it.
      - name: Test in a real browser
        working-directory: web
        run: |
          npm install --no-audit --no-fund playwright
          npx playwright install --with-deps chromium
          node test.mjs
          node test.mjs --bundle
          node test.mjs --bundle --csp

      - name: Assemble the site
        run: |
          mkdir -p _site
          cp web/index.html web/app.js web/worklet.js web/style.css web/bud.js _site/
          # The single file rides along, so the run is also somewhere to grab a copy that can be
          # opened from disk with no server at all.
          cp web/bud-standalone.html _site/
          # Pages serves from a subdirectory, and everything here is loaded relatively, so no
          # rewriting is needed. A .nojekyll stops Pages ignoring files it thinks are partials.
          touch _site/.nojekyll
          ls -la _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      # Downloadable on its own, so a run is useful even where Pages is not available: one file,
      # opened from disk, no server and no build.
      - uses: actions/upload-artifact@v4
        with:
          name: bud-standalone-html
          path: web/bud-standalone.html

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
